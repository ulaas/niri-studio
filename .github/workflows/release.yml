name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    # The oldest supported runner, so the binary runs on distributions with an older glibc.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libinput-dev libudev-dev libwayland-dev libxkbcommon-dev xkb-data
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --release -p niri-studio
      - name: Package
        id: package
        run: |
          name="niri-studio-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          strip -o "dist/$name/niri-studio" target/release/niri-studio
          cp resources/niri-studio.desktop LICENSE README.md "dist/$name/"
          cp resources/install-release.sh "dist/$name/install.sh"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "niri studio $GITHUB_REF_NAME" --generate-notes --verify-tag
