[workspace]
resolver = "2"
members = ["crates/doc", "crates/schema", "crates/live", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.87"

[workspace.dependencies]
kdl = { version = "6.7", features = ["v1"] }
# niri's own config parser and IPC types, pinned to the niri commit niri-studio is tested
# against, so what it accepts is exactly what that niri accepts.
niri-config = { git = "https://github.com/niri-wm/niri", rev = "d0cd58ec5ac6b2d41d42478fb4f3cc7c0c687db9" }
niri-ipc = { git = "https://github.com/niri-wm/niri", rev = "d0cd58ec5ac6b2d41d42478fb4f3cc7c0c687db9", features = ["clap"] }
miette = "5.10"
anyhow = "1"
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "default_fonts"] }
egui = "0.36"
doc = { path = "crates/doc", package = "niri-studio-doc" }
schema = { path = "crates/schema", package = "niri-studio-schema" }
live = { path = "crates/live", package = "niri-studio-live" }

[profile.release]
lto = "thin"
