[workspace]
resolver = "2"
members = ["crates/doc", "crates/schema", "crates/live", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.87"

[workspace.dependencies]
kdl = { version = "6.7", features = ["v1"] }
# niri's own config parser and IPC types, pinned to the niri commit niri-studio is tested
# against, so what it accepts is exactly what that niri accepts. This is the `minimize`
# branch of ulaas/niri: upstream niri plus floating-window minimize (`minimize-window`).
niri-config = { git = "https://github.com/ulaas/niri", rev = "fe5b5a31f617040ed808ecc87e61ed7b30d328e8" }
niri-ipc = { git = "https://github.com/ulaas/niri", rev = "fe5b5a31f617040ed808ecc87e61ed7b30d328e8", features = ["clap"] }
miette = "7.6"
anyhow = "1"
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "default_fonts"] }
egui = "0.36"
doc = { path = "crates/doc", package = "niri-studio-doc" }
schema = { path = "crates/schema", package = "niri-studio-schema" }
live = { path = "crates/live", package = "niri-studio-live" }

[profile.release]
lto = "thin"
